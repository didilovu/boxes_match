name: Build Windows application
on:
  push:
    branches: [main]
    paths: ['warehouse_app.py', 'shlop.ipynb', 'tests/**', '.github/workflows/build-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-exe
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pandas==2.2.3 numpy==2.1.3 openpyxl==3.1.5 pyinstaller==6.16.0
      - name: Test algorithm
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BoxesMatch --add-data "shlop.ipynb;." --hidden-import openpyxl --collect-all pandas warehouse_app.py
      - name: Test packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/BoxesMatch.exe -ArgumentList '--smoke-test shlop.xlsx smoke-result.xlsx' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Executable failed: $($process.ExitCode)" }
          python -c "import pandas as pd; x=pd.read_excel('smoke-result.xlsx',sheet_name=None); original=pd.read_excel('shlop.xlsx'); assert len(x['Товары'])+len(x['Требуют сверки'])==len(original); assert x['Товары']['Количество'].sum()+x['Требуют сверки']['Количество'].sum()==original['Количество'].sum(); assert x['Статистика']['перемещено_тар'].iloc[0]>0; assert 'Для склада' in x; assert (x['Для склада']['куда']=='да').sum()==x['Статистика']['создано_групп'].iloc[0]"
      - uses: actions/upload-artifact@v4
        with:
          name: BoxesMatch-Windows
          path: dist/BoxesMatch.exe
      - name: Save executable to main
        shell: pwsh
        run: |
          git fetch origin main
          git checkout -B main origin/main
          New-Item -ItemType Directory -Force windows | Out-Null
          Copy-Item dist/BoxesMatch.exe windows/BoxesMatch.exe
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/BoxesMatch.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Build Windows executable'
          git push origin HEAD:main
